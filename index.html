<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TradePulse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script>try{var _t=localStorage.getItem('tp_theme');if(_t)document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
<link rel="stylesheet" href="style.css"></head><body>
<div class="wrap">
<header><div><h1>TradePulse</h1><span class="sub" id="todayLbl"></span></div><button class="tbtn" id="tb" onclick="th()" aria-label="Toggle dark mode"></button></header>
<div id="banner"></div>

<section class="hero">
<div>
<div class="lbl">Account balance</div><div class="bal" id="bal"></div>
<div class="edit"><span>Starting balance ₹</span><input id="sb" type="number" inputmode="numeric" placeholder="0" onchange="sn('startBalance',this.value)"></div>
<div class="hs" id="bs"></div>
</div>
<div>
<div class="lbl">Previous total loss (₹)</div>
<input id="sp" class="bigin" type="number" inputmode="numeric" placeholder="0" onchange="sn('pastLoss',this.value)">
<div class="bar"><i id="rb"></i></div><div class="hs" id="rt"></div>
</div>
</section>

<section class="card quote"><div class="lbl">Today’s reminder</div><p id="qt"></p><div class="sub" id="co"></div></section>
<section class="two">
<div class="card"><div class="lbl">Loss limit today</div><div class="big" id="lv"></div><div class="bar"><i id="lb"></i></div><div class="edit"><span>Limit ₹</span><input id="sl" type="number" inputmode="numeric" placeholder="0" onchange="sn('dailyLossLimit',this.value)"></div></div>
<div class="card"><div class="lbl">Today’s P&amp;L</div><div class="big" id="gv"></div><div class="bar"><i id="gb" style="background:var(--g)"></i></div><div class="edit"><span>Target ₹</span><input id="sg" type="number" inputmode="numeric" placeholder="0" onchange="sn('dailyTarget',this.value)"></div></div>
</section>

<div class="main">
<div class="col">
<section class="card"><h2>Log your day</h2><div class="mode" id="mode"><button type="button" onclick="sm('TRADE')">Trade</button><button type="button" onclick="sm('NOTRADE')">No trade</button><button type="button" onclick="sm('HOLIDAY')">Holiday</button></div>
<div class="row">
<div><label>Date</label><input type="date" id="fd"></div>
<div><label>Session</label><select id="fs"><option>Morning</option><option>Afternoon</option><option>Expiry</option><option>Evening</option></select></div>
</div>
<div id="tf"><div class="row">
<div><label>Instrument</label><input id="ft" list="tk" placeholder="NIFTY 50"><datalist id="tk"><option>NIFTY 50</option><option>BANKNIFTY</option><option>FINNIFTY</option><option>SENSEX</option><option>CRUDE OIL</option></datalist></div>
<div><label>Gross P&amp;L ₹</label><input type="number" id="fa" min="0" inputmode="numeric" placeholder="0"></div>
<div><label>Charges ₹</label><input type="number" id="fc" min="0" inputmode="numeric" placeholder="0"></div>
</div>
<div class="seg"><button type="button" id="bp" class="on p" onclick="so('PROFIT')">Profit</button><button type="button" id="bl" onclick="so('LOSS')">Loss</button></div>
<div class="chips" id="chips"></div>
<input class="tagin" id="np" placeholder="+ add your own tag, press Enter" onkeydown="if(event.key==='Enter')ap()">
</div><textarea id="fr" rows="2" placeholder="What happened? What will you do differently?" style="margin-top:8px"></textarea>
<button class="pri" id="ab" onclick="add()">Add trade</button>
<div class="sub" id="fmsg" style="margin-top:6px"></div>
</section>
<section class="card"><h2>Insights</h2><div class="tiles" id="stats"></div><p class="sub" id="disc" style="margin:12px 0 0"></p></section>
</div>
<div class="col">
<section class="card"><div class="calhd"><button onclick="mv(-1)" aria-label="Previous month">‹</button><h2 id="calT"></h2><button onclick="mv(1)" aria-label="Next month">›</button></div><div class="cal" id="cal"></div></section>
<section class="card"><h2>Trades</h2><div id="list"></div></section>
</div>
</div>

<footer class="foot"><button onclick="bk()">Copy backup</button><button onclick="rst()">Restore</button></footer>
<div id="bx" hidden><textarea id="io" rows="4"></textarea></div>
<div class="sub" id="smsg">Your data is saved in this browser only.</div>
</div>
<script src="app.js"></script></body></html>
